<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neeraj FBX — Full Body Frame Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;font-family:Arial,sans-serif}
#stage{width:100%;height:100%;position:relative}
#ui{position:absolute;top:14px;left:14px;z-index:10;color:#fff;background:rgba(5,9,20,.78);padding:12px 14px;border:1px solid rgba(255,255,255,.16);border-radius:10px}
button{margin-top:8px;padding:8px 12px;border:0;border-radius:7px;cursor:pointer}
#status{font-size:12px;opacity:.8;margin-top:6px}
canvas{display:block}
</style>
</head>
<body>
<div id="stage">
<div id="ui"><strong>Neeraj — Full Body FBX Preview</strong><br>
<button id="fit">Fit Full Body</button><div id="status">Loading model…</div></div>
</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import {FBXLoader} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js";

const stage=document.getElementById("stage"),status=document.getElementById("status");
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050914);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,10000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x223355,2.2));
const key=new THREE.DirectionalLight(0xffffff,2.5);key.position.set(3,6,5);scene.add(key);
const fill=new THREE.DirectionalLight(0x88aaff,1.1);fill.position.set(-4,3,2);scene.add(fill);

let avatar=null;

function fitEntireAvatarToFrame(model){
 if(!model)return;
 model.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(model);
 if(box.isEmpty())return;
 const size=box.getSize(new THREE.Vector3());
 const center=box.getCenter(new THREE.Vector3());
 const padding=1.18;
 const vFov=THREE.MathUtils.degToRad(camera.fov);
 const hFov=2*Math.atan(Math.tan(vFov/2)*camera.aspect);
 const dh=(size.y*padding)/(2*Math.tan(vFov/2));
 const dw=(size.x*padding)/(2*Math.tan(hFov/2));
 const distance=Math.max(dh,dw,size.z*1.5,.5);
 camera.position.set(center.x,center.y+size.y*.01,center.z+distance);
 camera.near=Math.max(.01,distance/100);camera.far=Math.max(100,distance*20);
 camera.updateProjectionMatrix();
 controls.target.copy(center);
 controls.minDistance=distance*.45;controls.maxDistance=distance*5;controls.update();
 status.textContent="FULL BODY FITTED • head to feet";
}

new FBXLoader().load(
 "https://raw.githubusercontent.com/neerajkapil33/AI-Hologram/main/public/avatar/model.fbx",
 model=>{
  avatar=model;
  model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;}});
  scene.add(model);fitEntireAvatarToFrame(model);
 },
 xhr=>{if(xhr.total)status.textContent="Loading model… "+Math.round(xhr.loaded/xhr.total*100)+"%";},
 err=>{console.error(err);status.textContent="Could not load model.fbx";}
);

document.getElementById("fit").onclick=()=>fitEntireAvatarToFrame(avatar);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 if(avatar)fitEntireAvatarToFrame(avatar);
});

(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
</script>
</body>
</html>
