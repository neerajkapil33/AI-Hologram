<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meet Neeraj — AI Digital Hologram</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/hologram-edge.css" />
    <link rel="stylesheet" href="/hologram-hud.css" />
    <link rel="stylesheet" href="/hologram-audio-hud.css" />
    <style>
      #hologram-loader { position: fixed; inset: 0; background: #020710; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity .5s ease; }
      #hologram-loader.opacity-0 { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="hologram-loader" aria-live="polite">
      <div style="position:relative;width:96px;height:96px;margin-bottom:18px">
        <div style="position:absolute;inset:0;border-radius:50%;border:4px solid rgba(6,182,212,.18)"></div>
        <div style="position:absolute;inset:0;border-radius:50%;border:4px solid transparent;border-top-color:#22d3ee;animation:spin 1s linear infinite;box-shadow:0 0 18px #00f2fe"></div>
      </div>
      <div style="font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3em;color:#22d3ee">// COMPILING 3D CHARACTER METRICS //</div>
      <div id="loader-progress" style="margin-top:5px;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#64748b">DOWNLOADING DATA: 0%</div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const loader = document.getElementById('hologram-loader');
        const progress = document.getElementById('loader-progress');
        const hide = () => { if (!loader) return; loader.classList.add('opacity-0'); window.setTimeout(() => loader.remove(), 650); };
        const observeRoot = () => {
          const root = document.getElementById('root'); if (!root) return;
          const update = () => {
            const text = root.textContent || '';
            const match = text.match(/REAL NEERAJ 3D MODEL\s*•\s*(\d+)%/i);
            if (match && progress) progress.textContent = `DOWNLOADING DATA: ${match[1]}%`;
            if (/REAL NEERAJ 3D READY/i.test(text)) hide();
            if (/3D MODEL LOAD ERROR/i.test(text)) { if (progress) progress.textContent = '3D ASSET ERROR • CHECK MODEL DATA'; window.setTimeout(hide, 1800); }
          };
          new MutationObserver(update).observe(root, { childList: true, subtree: true, characterData: true }); update();
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', observeRoot, { once: true }); else observeRoot();
        window.addEventListener('load', () => window.setTimeout(hide, 12000), { once: true });
      })();
    </script>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    <script src="/audio-sync.js"></script>
    <script src="/app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
