name: Build NEERAJ AI Hologram

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Verify environment
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Build application
        run: pnpm run build
