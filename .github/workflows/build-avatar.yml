name: Build Neeraj AI Avatar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets_private/neeraj.jpg'
      - 'public/avatar/avatar.glb'
      - 'scripts/avatar/**'
      - '.github/workflows/build-avatar.yml'

permissions:
  contents: write

concurrency:
  group: neeraj-avatar-build
  cancel-in-progress: false

jobs:
  avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify master identity reference
        run: |
          test -s assets_private/neeraj.jpg
          file assets_private/neeraj.jpg

      - name: Detect available avatar generation route
        id: route
        env:
          AVATARSDK_CLIENT_ID: ${{ secrets.AVATARSDK_CLIENT_ID }}
          AVATARSDK_CLIENT_SECRET: ${{ secrets.AVATARSDK_CLIENT_SECRET }}
        run: |
          if [ -n "$AVATARSDK_CLIENT_ID" ] && [ -n "$AVATARSDK_CLIENT_SECRET" ]; then
            echo "mode=avatarsdk" >> "$GITHUB_OUTPUT"
            echo "AvatarSDK credentials detected; automated photo-to-avatar generation enabled."
          elif [ -s public/avatar/avatar.glb ]; then
            echo "mode=ingest" >> "$GITHUB_OUTPUT"
            echo "No AvatarSDK credentials; using existing production GLB."
          else
            echo "mode=blocked" >> "$GITHUB_OUTPUT"
            echo "No AvatarSDK credentials and no production GLB."
          fi

      - name: Setup Python
        if: steps.route.outputs.mode == 'avatarsdk' || steps.route.outputs.mode == 'ingest'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AvatarSDK generator dependency
        if: steps.route.outputs.mode == 'avatarsdk'
        run: python -m pip install --disable-pip-version-check requests

      - name: Generate Neeraj GLB with AvatarSDK
        if: steps.route.outputs.mode == 'avatarsdk'
        env:
          AVATARSDK_CLIENT_ID: ${{ secrets.AVATARSDK_CLIENT_ID }}
          AVATARSDK_CLIENT_SECRET: ${{ secrets.AVATARSDK_CLIENT_SECRET }}
        run: python scripts/avatar/avatarsdk_generate.py

      - name: Validate production GLB
        if: steps.route.outputs.mode == 'avatarsdk' || steps.route.outputs.mode == 'ingest'
        run: python scripts/avatar/validate_glb.py public/avatar/avatar.glb

      - name: Explain missing generation input
        if: steps.route.outputs.mode == 'blocked'
        run: |
          echo 'STOP: no production avatar is being substituted.'
          echo 'Either configure AVATARSDK_CLIENT_ID + AVATARSDK_CLIENT_SECRET as GitHub Actions secrets,'
          echo 'or export a rigged GLB with facial morph targets and place it at public/avatar/avatar.glb.'
          exit 1

      - name: Publish generated GLB to main
        if: steps.route.outputs.mode == 'avatarsdk'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/avatar/avatar.glb
          if git diff --cached --quiet; then
            echo 'No GLB change to publish.'
            exit 0
          fi
          git commit -m 'build: publish generated Neeraj AI avatar GLB'
          git push origin HEAD:main
