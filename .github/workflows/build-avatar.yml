name: Build Neeraj AI Avatar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets_private/**'
      - 'public/avatar/avatar.glb'
      - 'scripts/avatar/**'
      - '.github/workflows/build-avatar.yml'

permissions:
  contents: write

concurrency:
  group: neeraj-avatar-build
  cancel-in-progress: false

jobs:
  validate-production:
    name: Validate production Neeraj GLB
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify identity references
        run: |
          test -s assets_private/neeraj.jpg
          test -s assets_private/neeraj-reference.mp4
          test -s assets_private/neeraj-voice-reference.wav

      - name: Validate production GLB when present
        if: hashFiles('public/avatar/avatar.glb') != ''
        run: python scripts/avatar/validate_glb.py public/avatar/avatar.glb

      - name: Report missing production asset
        if: hashFiles('public/avatar/avatar.glb') == ''
        run: |
          echo 'Production gate: public/avatar/avatar.glb is not present yet.'
          echo 'The repository intentionally does not substitute a generic avatar.'

  build-photo-reference:
    name: Build Neeraj facial reference GLB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build credential-free facial GLB
        run: |
          mkdir -p public/avatar
          node scripts/avatar/generate_photo_glb.mjs assets_private/neeraj.jpg public/avatar/neeraj-face.glb
          test -s public/avatar/neeraj-face.glb

      - name: Upload facial reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: neeraj-facial-reference-glb
          path: public/avatar/neeraj-face.glb
          if-no-files-found: error

  production:
    name: Production avatar contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-production
    if: hashFiles('public/avatar/avatar.glb') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate final contract
        run: python scripts/avatar/validate_glb.py public/avatar/avatar.glb
