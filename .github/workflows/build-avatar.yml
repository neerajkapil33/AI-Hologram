name: Build Neeraj AI Avatar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets_private/neeraj.jpg'
      - 'public/avatar/avatar.glb'
      - 'scripts/avatar/**'
      - '.github/workflows/build-avatar.yml'

permissions:
  contents: write

concurrency:
  group: neeraj-avatar-build
  cancel-in-progress: false

jobs:
  avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify master identity reference
        run: |
          test -s assets_private/neeraj.jpg
          file assets_private/neeraj.jpg

      - name: Detect available avatar generation route
        id: route
        env:
          AVATARSDK_CLIENT_ID: ${{ secrets.AVATARSDK_CLIENT_ID }}
          AVATARSDK_CLIENT_SECRET: ${{ secrets.AVATARSDK_CLIENT_SECRET }}
        run: |
          if [ -n "$AVATARSDK_CLIENT_ID" ] && [ -n "$AVATARSDK_CLIENT_SECRET" ]; then
            echo "mode=avatarsdk" >> "$GITHUB_OUTPUT"
            echo "AvatarSDK credentials detected; using the full-body production route."
          elif [ -s public/avatar/avatar.glb ]; then
            echo "mode=ingest" >> "$GITHUB_OUTPUT"
            echo "Existing full-body production GLB found; leaving it untouched."
          elif [ -s public/avatar/neeraj-face.glb ]; then
            echo "mode=ingest" >> "$GITHUB_OUTPUT"
            echo "Existing credential-free Neeraj face GLB found; leaving it untouched."
          else
            echo "mode=photo" >> "$GITHUB_OUTPUT"
            echo "No provider credentials or generated asset; using credential-free photo-to-ARKit-GLB route."
          fi

      - name: Setup Python
        if: steps.route.outputs.mode == 'avatarsdk' || steps.route.outputs.mode == 'ingest' && hashFiles('public/avatar/avatar.glb') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AvatarSDK generator dependency
        if: steps.route.outputs.mode == 'avatarsdk'
        run: python -m pip install --disable-pip-version-check requests

      - name: Generate full-body Neeraj GLB with AvatarSDK
        if: steps.route.outputs.mode == 'avatarsdk'
        env:
          AVATARSDK_CLIENT_ID: ${{ secrets.AVATARSDK_CLIENT_ID }}
          AVATARSDK_CLIENT_SECRET: ${{ secrets.AVATARSDK_CLIENT_SECRET }}
        run: python scripts/avatar/avatarsdk_generate.py

      - name: Generate Neeraj photo-driven animated face GLB
        if: steps.route.outputs.mode == 'photo'
        run: |
          node scripts/avatar/generate_photo_glb.mjs assets_private/neeraj.jpg public/avatar/neeraj-face.glb
          test -s public/avatar/neeraj-face.glb
          node -e "const fs=require('fs'); const b=fs.readFileSync('public/avatar/neeraj-face.glb'); if(b.subarray(0,4).toString()!=='glTF') process.exit(1); console.log('Valid GLB header:', b.length, 'bytes')"

      - name: Validate full-body production GLB
        if: steps.route.outputs.mode == 'avatarsdk' || (steps.route.outputs.mode == 'ingest' && hashFiles('public/avatar/avatar.glb') != '')
        run: |
          python scripts/avatar/validate_glb.py public/avatar/avatar.glb

      - name: Publish generated avatar assets to main
        if: steps.route.outputs.mode == 'avatarsdk' || steps.route.outputs.mode == 'photo'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/avatar/avatar.glb public/avatar/neeraj-face.glb
          if git diff --cached --quiet; then
            echo 'No avatar asset change to publish.'
            exit 0
          fi
          git commit -m 'build: publish generated Neeraj avatar asset'
          git push origin HEAD:main
