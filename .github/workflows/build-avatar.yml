name: Build Neeraj AI Avatar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets_private/**'
      - 'public/avatar/avatar.glb'
      - 'scripts/avatar/**'
      - '.github/workflows/build-avatar.yml'

permissions:
  contents: read

concurrency:
  group: neeraj-avatar-build
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Neeraj avatar inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify approved identity references
        run: |
          test -s assets_private/neeraj.jpg
          test -s assets_private/neeraj-reference.mp4
          test -s assets_private/neeraj-voice-reference.wav

      - name: Validate production GLB when present
        shell: bash
        run: |
          if [ -f public/avatar/avatar.glb ]; then
            python scripts/avatar/validate_glb.py public/avatar/avatar.glb
          else
            echo 'Production GLB not present; no generic avatar will be substituted.'
          fi

  facial-reference:
    name: Build Neeraj facial reference GLB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate photo-driven facial GLB
        run: |
          mkdir -p public/avatar
          node scripts/avatar/generate_photo_glb.mjs assets_private/neeraj.jpg public/avatar/neeraj-face.glb
          test -s public/avatar/neeraj-face.glb

      - name: Upload facial reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: neeraj-facial-reference-glb
          path: public/avatar/neeraj-face.glb
          if-no-files-found: error

  production-gate:
    name: Production GLB gate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require a real rigged production GLB
        shell: bash
        run: |
          if [ ! -f public/avatar/avatar.glb ]; then
            echo 'No public/avatar/avatar.glb exists yet.'
            echo 'The production gate remains closed until a real Neeraj full-body rigged GLB is supplied/generated.'
            exit 1
          fi
          python scripts/avatar/validate_glb.py public/avatar/avatar.glb
