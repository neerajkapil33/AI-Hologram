name: Build Neeraj AI Avatar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets_private/**'
      - 'public/avatar/avatar.glb'
      - 'public/profile/scene.gltf'
      - 'public/profile/scene.bin'
      - 'public/profile/*.jpeg'
      - 'public/profile/*.png'
      - 'scripts/avatar/**'
      - '.github/workflows/build-avatar.yml'

permissions:
  contents: read

concurrency:
  group: neeraj-avatar-build
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Neeraj avatar inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify approved identity references
        run: |
          test -s assets_private/neeraj.jpg
          test -s assets_private/neeraj-reference.mp4
          test -s assets_private/neeraj-voice-reference.wav

      - name: Validate production GLB when it is a real binary
        shell: bash
        run: |
          if [ -f public/avatar/avatar.glb ] && [ "$(wc -c < public/avatar/avatar.glb)" -gt 1024 ]; then
            python scripts/avatar/validate_glb.py public/avatar/avatar.glb
          else
            echo 'No usable production GLB; the repository Neeraj GLTF + BIN is the active 3D source.'
          fi

      - name: Validate repository Neeraj GLTF payload
        run: |
          test -s public/profile/scene.gltf
          test -s public/profile/scene.bin
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('public/profile/scene.gltf')
          data = json.loads(p.read_text(encoding='utf-8'))
          buffers = data.get('buffers', [])
          assert buffers, 'scene.gltf has no buffers'
          assert Path('public/profile/scene.bin').stat().st_size > 0, 'scene.bin is empty'
          external = [b.get('uri', '') for b in buffers if b.get('uri', '').endswith('.bin')]
          assert external, 'scene.gltf does not reference an external BIN payload'
          print('Valid Neeraj GLTF:', p)
          print('External buffers:', external)
          print('Meshes:', len(data.get('meshes', [])), 'Nodes:', len(data.get('nodes', [])))
          PY

  facial-reference:
    name: Build Neeraj facial reference GLB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate photo-driven facial GLB
        run: |
          mkdir -p public/avatar
          node scripts/avatar/generate_photo_glb.mjs assets_private/neeraj.jpg public/avatar/neeraj-face.glb
          test -s public/avatar/neeraj-face.glb

      - name: Upload facial reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: neeraj-facial-reference-glb
          path: public/avatar/neeraj-face.glb
          if-no-files-found: error

  production-gate:
    name: Production 3D avatar gate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Accept production GLB or validated Neeraj GLTF source
        shell: bash
        run: |
          if [ -f public/avatar/avatar.glb ] && [ "$(wc -c < public/avatar/avatar.glb)" -gt 1024 ]; then
            python scripts/avatar/validate_glb.py public/avatar/avatar.glb
            echo 'Production rigged GLB accepted.'
          else
            test -s public/profile/scene.gltf
            test -s public/profile/scene.bin
            echo 'Production 3D source accepted: public/profile/scene.gltf + scene.bin'
            echo 'A future rigged GLB can replace this source without changing the browser runtime.'
          fi
